services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the local database}
      POSTGRES_DB: bootcamper_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bootcamper_development"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?Set RAILS_MASTER_KEY for the development credentials}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    command: sh -c "bin/rails db:prepare && bin/rails server -b 0.0.0.0"

volumes:
  bundle_cache:
  postgres_data:
