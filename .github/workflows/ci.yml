name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  TEST_IMAGE: bootcamper-test:ci
  TEST_IMAGE_ARTIFACT: bootcamper-test-image

jobs:
  build-test-image:
    name: Build test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build cached test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          tags: ${{ env.TEST_IMAGE }}
          outputs: type=docker,dest=/tmp/bootcamper-test.tar
          cache-from: type=gha,scope=test-image
          cache-to: type=gha,mode=max,scope=test-image
      - name: Compress test image
        run: zstd --threads=0 --fast=3 /tmp/bootcamper-test.tar -o /tmp/bootcamper-test.tar.zst
      - name: Share test image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TEST_IMAGE_ARTIFACT }}
          path: /tmp/bootcamper-test.tar.zst
          compression-level: 0
          retention-days: 1

  be-lint:
    name: Backend lint
    needs: build-test-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.TEST_IMAGE_ARTIFACT }}
          path: /tmp
      - name: Load test image
        run: zstd --decompress --stdout /tmp/bootcamper-test.tar.zst | docker load
      - name: Run backend linters
        run: docker run --rm $TEST_IMAGE bin/quality be

  fe-lint:
    name: Frontend lint
    needs: build-test-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.TEST_IMAGE_ARTIFACT }}
          path: /tmp
      - name: Load test image
        run: zstd --decompress --stdout /tmp/bootcamper-test.tar.zst | docker load
      - name: Run frontend linters
        run: >-
          docker run --rm
          -e REQUIRE_MASTER_KEY=false
          -e DATABASE_URL=postgresql:///bootcamper_build
          $TEST_IMAGE bin/quality fe

  checks:
    name: Security and consistency
    needs: [be-lint, fe-lint]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bootcamper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bootcamper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.TEST_IMAGE_ARTIFACT }}
          path: /tmp
      - name: Load test image
        run: zstd --decompress --stdout /tmp/bootcamper-test.tar.zst | docker load
      - name: Prepare database and run checks
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY_TEST }}
        run: >-
          docker run --rm --network host
          -e RAILS_ENV=test
          -e RAILS_MASTER_KEY
          -e DATABASE_HOST=127.0.0.1
          -e DATABASE_USERNAME=postgres
          -e DATABASE_PASSWORD=postgres
          -e DATABASE_NAME=bootcamper_test
          $TEST_IMAGE
          sh -c "bin/rails db:prepare && bin/quality checks"

  tests:
    name: Tests
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bootcamper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bootcamper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.TEST_IMAGE_ARTIFACT }}
          path: /tmp
      - name: Load test image
        run: zstd --decompress --stdout /tmp/bootcamper-test.tar.zst | docker load
      - name: Prepare database and run tests
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY_TEST }}
        run: >-
          docker run --rm --network host
          -v $GITHUB_WORKSPACE/coverage:/app/coverage
          -e CI=true
          -e RAILS_ENV=test
          -e RAILS_MASTER_KEY
          -e DATABASE_HOST=127.0.0.1
          -e DATABASE_USERNAME=postgres
          -e DATABASE_PASSWORD=postgres
          -e DATABASE_NAME=bootcamper_test
          $TEST_IMAGE
          sh -c "bin/rails db:prepare && bundle exec rspec"
      - name: Share coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

  production-smoke:
    name: Production smoke
    needs: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bootcamper_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bootcamper_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build cached runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          tags: bootcamper-runtime:ci
          load: true
          cache-from: type=gha,scope=runtime-image
          cache-to: type=gha,mode=max,scope=runtime-image
      - name: Prepare production database
        run: >-
          docker run --rm --network host
          -e RAILS_ENV=production
          -e REQUIRE_MASTER_KEY=false
          -e SECRET_KEY_BASE=ci-smoke-secret-key-base-ci-smoke-secret-key-base-ci-smoke-secret-key-base
          -e APP_HOST=localhost
          -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/bootcamper_smoke
          bootcamper-runtime:ci bin/rails db:prepare
      - name: Boot production image
        run: >-
          docker run --detach --name bootcamper-smoke --network host
          -e RAILS_ENV=production
          -e REQUIRE_MASTER_KEY=false
          -e SECRET_KEY_BASE=ci-smoke-secret-key-base-ci-smoke-secret-key-base-ci-smoke-secret-key-base
          -e APP_HOST=localhost
          -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/bootcamper_smoke
          bootcamper-runtime:ci
      - name: Verify HTTP response
        run: 'curl --fail --retry 10 --retry-delay 2 --header "X-Forwarded-Proto: https" http://127.0.0.1:3000/'
      - name: Show server logs
        if: failure()
        run: docker logs bootcamper-smoke || true
      - name: Stop smoke container
        if: always()
        run: docker rm --force bootcamper-smoke 2>/dev/null || true
