    body: |-
      # TICKET-004: Invalidate sessions after account blocking
      ## Observable goal
      Blocking rejects every existing session; unblocking never resumes them and requires new sign-in.
      ## Source IDEA, EPIC, version, and scenario IDs
      IDEA-009/v003; EPIC-002/v002; SCENARIO-020.
      ## Acceptance evidence
      Request specs prove multiple-session denial before and after unblock, including a fresh sign-in requirement after unblocking.
      ## Dependencies
      TICKET-011
      ## Difficulty (1-5)
      4
      ## Estimate (ideal days, at most 2)
      2
      ## Risks
      Every authenticated path must enforce server-checked invalidation; session generation must not be revived by unblock.
      ## External actions
      Administrator-owned system must use the agreed block transition.
      ## Allowed scope
      Persisted session generation, authentication hooks, invalidation, and focused specs consuming TICKET-011's blocked-account state; no admin UI or block-state ownership.
    idea_id: IDEA-009
