default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST") { Rails.application.credentials.fetch(:database).fetch(:host) } %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { Rails.application.credentials.fetch(:database).fetch(:username) } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { Rails.application.credentials.fetch(:database).fetch(:password) } %>
  gssencmode: disable

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { Rails.application.credentials.fetch(:database).fetch(:name) } %>

docker:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { Rails.application.credentials.fetch(:database).fetch(:name) } %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { Rails.application.credentials.fetch(:database).fetch(:name) } %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { Rails.application.credentials.fetch(:database).fetch(:name) } %>
